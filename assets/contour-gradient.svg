<svg xmlns="http://www.w3.org/2000/svg" width="8" height="512" viewBox="0 0 8 512">
  <!-- Original analytic glow mask: narrow leading edge, continuous soft tail. -->
  <defs><linearGradient id="glow" x1="0" y1="0" x2="0" y2="1" color-interpolation="sRGB">
    <stop offset="0" stop-color="#000000" stop-opacity="0"/>
    <stop offset="0.025" stop-color="#ffffff" stop-opacity="1"/>
    <stop offset="0.0625" stop-color="#dddddd" stop-opacity="0.867"/>
    <stop offset="0.2" stop-color="#bbbbbb" stop-opacity="0.733"/>
    <stop offset="0.4" stop-color="#808080" stop-opacity="0.502"/>
    <stop offset="0.7" stop-color="#282828" stop-opacity="0.157"/>
    <stop offset="1" stop-color="#000000" stop-opacity="0"/>
  </linearGradient></defs>
  <rect width="8" height="512" fill="url(#glow)"/>
</svg>
